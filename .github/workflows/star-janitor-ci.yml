name: Star Janitor design port verification

on:
  push:
    branches:
      - ci/star-janitor-20260801
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out CI payload
        uses: actions/checkout@v4

      - name: Expand verified baseline and design overrides
        run: |
          set -euo pipefail
          cat payload/chunk00 payload/chunk01 payload/chunk02 payload/chunk03 payload/chunk04 \
            | base64 --decode \
            | tar -xJf -
          cp overrides/styles/responsive.css star-janitor-ci/styles/responsive.css
          cp overrides/tsconfig.json star-janitor-ci/tsconfig.json
          cp overrides/tests/unit/build-config.test.mjs star-janitor-ci/tests/unit/build-config.test.mjs
          cat payload/design-override00 payload/design-override01 payload/design-override02 payload/design-override03 \
            | base64 --decode > /tmp/star-janitor-design-overrides.tar.xz
          echo "a7861a45f85ddb0f5a67fc26b8cb7217c4f36942d6b7f9b4decb6200e4988d55  /tmp/star-janitor-design-overrides.tar.xz" \
            | sha256sum --check
          tar -xJf /tmp/star-janitor-design-overrides.tar.xz -C star-janitor-ci
          cp overrides/final-docs/verification.md star-janitor-ci/docs/verification.md
          cp overrides/final-docs/README.md star-janitor-ci/README.md
          cp overrides/final-docs/CODEX_HANDOFF.md star-janitor-ci/CODEX_HANDOFF.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and verify package lock
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm install
          echo "ce1f9307baeacb6ecc2ff74bb5c2f155f69905e13fefde49686d327a6a22edc5  package-lock.json" \
            | sha256sum --check

      - name: Create and inspect source ZIP
        run: |
          set -euo pipefail
          rm -f star-janitor-design-source-final.zip star-janitor-design-source-final.zip.sha256
          (
            cd star-janitor-ci
            zip -q -r ../star-janitor-design-source-final.zip . \
              -x 'node_modules/*' '*/node_modules/*' \
                 '.next/*' '*/.next/*' \
                 'ci-artifacts/*' '*/ci-artifacts/*' \
                 'playwright-report/*' '*/playwright-report/*' \
                 'test-results/*' '*/test-results/*' \
                 '.test-build/*' '*/.test-build/*' \
                 '.git/*' '*/.git/*' \
                 'tsconfig.tsbuildinfo' '*/tsconfig.tsbuildinfo' \
                 '.env' '.env.local' '.env.production' '.env.development' '.env.test'
          )
          sha256sum star-janitor-design-source-final.zip \
            > star-janitor-design-source-final.zip.sha256
          unzip -t star-janitor-design-source-final.zip
          unzip -Z1 star-janitor-design-source-final.zip > archive-entries.txt
          grep -qx 'package-lock.json' archive-entries.txt
          for required in \
            'features/dashboard/repository-row.tsx' \
            'features/dashboard/confirmation-dialog.tsx' \
            'styles/dashboard.css' \
            'styles/dialog-error.css' \
            'styles/responsive.css' \
            'tests/unit/design-port-contracts.test.mjs' \
            '.ci/capture-visuals.mjs' \
            'docs/verification.md' \
            'README.md' \
            'CODEX_HANDOFF.md'; do
            grep -qx "$required" archive-entries.txt
          done
          if grep -Eq '(^|/)(node_modules|\.next|ci-artifacts)(/|$)' archive-entries.txt; then
            echo 'Forbidden directory found in source ZIP' >&2
            grep -E '(^|/)(node_modules|\.next|ci-artifacts)(/|$)' archive-entries.txt >&2
            exit 1
          fi
          cat star-janitor-design-source-final.zip.sha256

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: star-janitor-design-source-final
          path: |
            star-janitor-design-source-final.zip
            star-janitor-design-source-final.zip.sha256
            archive-entries.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out CI payload
        uses: actions/checkout@v4

      - name: Expand verified baseline and design overrides
        run: |
          set -euo pipefail
          cat payload/chunk00 payload/chunk01 payload/chunk02 payload/chunk03 payload/chunk04 \
            | base64 --decode \
            | tar -xJf -
          cp overrides/styles/responsive.css star-janitor-ci/styles/responsive.css
          cp overrides/tsconfig.json star-janitor-ci/tsconfig.json
          cp overrides/tests/unit/build-config.test.mjs star-janitor-ci/tests/unit/build-config.test.mjs
          cat payload/design-override00 payload/design-override01 payload/design-override02 payload/design-override03 \
            | base64 --decode > /tmp/star-janitor-design-overrides.tar.xz
          echo "a7861a45f85ddb0f5a67fc26b8cb7217c4f36942d6b7f9b4decb6200e4988d55  /tmp/star-janitor-design-overrides.tar.xz" \
            | sha256sum --check
          tar -xJf /tmp/star-janitor-design-overrides.tar.xz -C star-janitor-ci
          cp overrides/final-docs/verification.md star-janitor-ci/docs/verification.md
          cp overrides/final-docs/README.md star-janitor-ci/README.md
          cp overrides/final-docs/CODEX_HANDOFF.md star-janitor-ci/CODEX_HANDOFF.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record runtime versions
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          { node --version; npm --version; } | tee ci-artifacts/runtime-versions.log

      - name: Install dependencies and verify package lock
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm install 2>&1 | tee ci-artifacts/npm-install.log
          echo "ce1f9307baeacb6ecc2ff74bb5c2f155f69905e13fefde49686d327a6a22edc5  package-lock.json" \
            | sha256sum --check
          npm audit --json > ci-artifacts/npm-audit.json || true

      - name: Run full verification chain
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee ci-artifacts/verify.log

      - name: Install Playwright Chromium and Japanese fallback fonts
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npx playwright install chromium 2>&1 | tee ci-artifacts/playwright-install.log
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'sans-serif:lang=ja' | tee ci-artifacts/font-match.log

      - name: Run Playwright E2E suite
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee ci-artifacts/e2e.log

      - name: Capture exact-size production visual evidence
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > ci-artifacts/production-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/demo >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ci-artifacts/production-server.log
              exit 1
            fi
            if [ "$attempt" -eq 120 ]; then
              cat ci-artifacts/production-server.log
              exit 1
            fi
            sleep 1
          done
          node .ci/capture-visuals.mjs 2>&1 | tee ci-artifacts/visual-capture.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-janitor-design-verification
          path: |
            star-janitor-ci/ci-artifacts/
            star-janitor-ci/package-lock.json
            star-janitor-ci/playwright-report/
            star-janitor-ci/test-results/
          if-no-files-found: warn
          retention-days: 7
