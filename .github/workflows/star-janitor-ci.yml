name: Star Janitor completion verification

on:
  push:
    branches:
      - ci/star-janitor-20260801
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out CI payload
        uses: actions/checkout@v4

      - name: Expand final Star Janitor candidate
        run: |
          set -euo pipefail
          cat payload/chunk00 payload/chunk01 payload/chunk02 payload/chunk03 payload/chunk04 \
            | base64 --decode \
            | tar -xJf -
          cp overrides/styles/responsive.css star-janitor-ci/styles/responsive.css
          cp overrides/tsconfig.json star-janitor-ci/tsconfig.json
          cp overrides/tests/unit/build-config.test.mjs star-janitor-ci/tests/unit/build-config.test.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record runtime versions
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          { node --version; npm --version; } | tee ci-artifacts/runtime-versions.log

      - name: Install dependencies and verify the final lockfile
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm install 2>&1 | tee ci-artifacts/npm-install.log
          echo "ce1f9307baeacb6ecc2ff74bb5c2f155f69905e13fefde49686d327a6a22edc5  package-lock.json" | sha256sum --check
          npm audit --json > ci-artifacts/npm-audit.json || true

      - name: Run full verification chain
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee ci-artifacts/verify.log

      - name: Install Playwright Chromium and Japanese fallback fonts
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npx playwright install chromium 2>&1 | tee ci-artifacts/playwright-install.log
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'sans-serif:lang=ja' | tee ci-artifacts/font-match.log

      - name: Run Playwright E2E suite
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee ci-artifacts/e2e.log

      - name: Capture exact-size production visual evidence
        working-directory: star-janitor-ci
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > ci-artifacts/production-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/demo >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat ci-artifacts/production-server.log; exit 1; fi
            if [ "$attempt" -eq 120 ]; then cat ci-artifacts/production-server.log; exit 1; fi
            sleep 1
          done
          node .ci/capture-visuals.mjs 2>&1 | tee ci-artifacts/visual-capture.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-janitor-verification
          path: |
            star-janitor-ci/ci-artifacts/
            star-janitor-ci/package-lock.json
            star-janitor-ci/playwright-report/
            star-janitor-ci/test-results/
          if-no-files-found: warn
          retention-days: 7
